name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36 virtualenv
      - name: Build APK
        run: |
          set -o pipefail
          java -version
          buildozer android debug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -n -i -A8 "What went wrong" build.log | tail -n 30
          grep -n -i "requires Java\|JAVA_HOME\|Unsupported" build.log | tail -n 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            bin/*.apk
            build.log
